<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alif Weather 🌍</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(circle at top, #17446a, #07111f 55%, #040911);
  padding: 22px;
}

.app {
  max-width: 1050px;
  margin: auto;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 45px;
  font-weight: 900;
}

.logo span {
  color: #55b8ff;
}

.subtitle {
  color: #9eb0c8;
  margin-top: 5px;
}

.search {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}

.search input {
  flex: 1;
  padding: 14px;
  border: 1px solid #29405f;
  border-radius: 12px;
  background: #0a1525;
  color: white;
  font-size: 16px;
  outline: none;
}

button {
  padding: 13px 17px;
  border: 1px solid #29405f;
  border-radius: 12px;
  background: #55b8ff;
  color: #03111d;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.1);
}

.secondary {
  background: #17283f;
  color: white;
}

.status {
  text-align: center;
  min-height: 24px;
  color: #9eb0c8;
}

.current-grid {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 16px;
}

.card {
  background: rgba(18, 31, 52, 0.92);
  border: 1px solid #29405f;
  border-radius: 22px;
  padding: 22px;
  box-shadow: 0 18px 55px #0005;
}

.place {
  font-size: 26px;
  font-weight: bold;
}

.zone {
  color: #9eb0c8;
  font-size: 13px;
  margin-top: 5px;
}

.main-weather {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-top: 20px;
}

.weather-icon {
  font-size: 75px;
}

.temperature {
  font-size: 64px;
  font-weight: 900;
}

.condition {
  color: #9eb0c8;
  font-size: 18px;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stat {
  padding: 14px;
  background: #0b1728;
  border: 1px solid #29405f;
  border-radius: 15px;
}

.stat b {
  display: block;
  font-size: 20px;
  margin-top: 5px;
}

.stat span {
  color: #9eb0c8;
  font-size: 12px;
}

.forecast {
  margin-top: 16px;
}

.forecast h2 {
  margin-top: 0;
}

.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 9px;
}

.day {
  text-align: center;
  padding: 13px 7px;
  background: #0b1728;
  border: 1px solid #29405f;
  border-radius: 15px;
}

.day-icon {
  font-size: 30px;
  margin: 10px;
}

.rain {
  font-size: 12px;
  color: #9eb0c8;
  margin-top: 5px;
}

.info {
  text-align: center;
  color: #7286a3;
  font-size: 12px;
  margin: 16px;
}

@media (max-width: 800px) {
  .current-grid {
    grid-template-columns: 1fr;
  }

  .days {
    grid-template-columns: repeat(4, 1fr);
  }
}

@media (max-width: 520px) {
  body {
    padding: 12px;
  }

  .search {
    flex-direction: column;
  }

  .days {
    grid-template-columns: repeat(2, 1fr);
  }

  .temperature {
    font-size: 52px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">
    Alif <span>Weather</span> 🌍
  </div>

  <div class="subtitle">
    Worldwide Weather Search
  </div>
</header>

<div class="search">

  <input
    id="cityInput"
    type="text"
    placeholder="Search any city... e.g. Dhaka, London, Tokyo"
  >

  <button onclick="searchCity()">
    🔎 Search
  </button>

  <button class="secondary" onclick="useLocation()">
    📍 My Location
  </button>

</div>

<div id="status" class="status"></div>

<div id="weatherApp" style="display:none;">

  <div class="current-grid">

    <section class="card">

      <div id="place" class="place">
        —
      </div>

      <div id="timezone" class="zone">
        —
      </div>

      <div class="main-weather">

        <div id="weatherIcon" class="weather-icon">
          🌤️
        </div>

        <div>

          <div id="temperature" class="temperature">
            —
          </div>

          <div id="condition" class="condition">
            —
          </div>

        </div>

      </div>

    </section>

    <section class="card">

      <div class="stats">

        <div class="stat">
          💧 Humidity
          <b id="humidity">—</b>
          <span>Relative humidity</span>
        </div>

        <div class="stat">
          💨 Wind
          <b id="wind">—</b>
          <span>Wind speed</span>
        </div>

        <div class="stat">
          🌧️ Rain Chance
          <b id="rain">—</b>
          <span>Today</span>
        </div>

        <div class="stat">
          🌡️ Feels Like
          <b id="feels">—</b>
          <span>Apparent temperature</span>
        </div>

        <div class="stat">
          🌅 Sunrise
          <b id="sunrise">—</b>
          <span>Local time</span>
        </div>

        <div class="stat">
          🌇 Sunset
          <b id="sunset">—</b>
          <span>Local time</span>
        </div>

      </div>

    </section>

  </div>

  <section class="card forecast">

    <h2>
      📅 7-Day Forecast
    </h2>

    <div id="forecast" class="days"></div>

  </section>

  <div class="info">
    Weather data provided by Open-Meteo
  </div>

</div>

</div>

<script>

const weatherCodes = {

  0: ["Clear Sky", "☀️"],
  1: ["Mainly Clear", "🌤️"],
  2: ["Partly Cloudy", "⛅"],
  3: ["Overcast", "☁️"],

  45: ["Fog", "🌫️"],
  48: ["Fog", "🌫️"],

  51: ["Light Drizzle", "🌦️"],
  53: ["Drizzle", "🌦️"],
  55: ["Heavy Drizzle", "🌧️"],

  61: ["Light Rain", "🌦️"],
  63: ["Rain", "🌧️"],
  65: ["Heavy Rain", "🌧️"],

  71: ["Light Snow", "🌨️"],
  73: ["Snow", "❄️"],
  75: ["Heavy Snow", "❄️"],

  80: ["Rain Showers", "🌦️"],
  81: ["Rain Showers", "🌧️"],
  82: ["Heavy Showers", "⛈️"],

  85: ["Snow Showers", "🌨️"],
  86: ["Heavy Snow Showers", "❄️"],

  95: ["Thunderstorm", "⛈️"],
  96: ["Thunderstorm + Hail", "⛈️"],
  99: ["Thunderstorm + Hail", "⛈️"]

};


function setStatus(message) {

  document.getElementById("status").textContent = message;

}


function getTime(value) {

  if (!value) return "—";

  return value.split("T")[1].substring(0, 5);

}


function getDay(date) {

  return new Date(
    date + "T12:00:00"
  ).toLocaleDateString(
    undefined,
    { weekday: "short" }
  );

}


async function searchCity() {

  const city =
    document.getElementById("cityInput").value.trim();

  if (!city) {

    setStatus("Please enter a city.");

    return;

  }

  setStatus("🌍 Searching worldwide...");

  try {

    const response = await fetch(
      "https://geocoding-api.open-meteo.com/v1/search?name="
      + encodeURIComponent(city)
      + "&count=1&language=en&format=json"
    );

    const data = await response.json();

    if (!data.results || data.results.length === 0) {

      setStatus("❌ City not found.");

      return;

    }

    const location = data.results[0];

    loadWeather(
      location.latitude,
      location.longitude,
      location.name,
      location.country
    );

  }

  catch {

    setStatus(
      "❌ Search failed. Check your internet connection."
    );

  }

}


async function loadWeather(
  latitude,
  longitude,
  city,
  country
) {

  setStatus("🌦️ Loading weather...");

  try {

    const url =
      "https://api.open-meteo.com/v1/forecast"
      + "?latitude=" + latitude
      + "&longitude=" + longitude
      + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m"
      + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset"
      + "&temperature_unit=celsius"
      + "&wind_speed_unit=kmh"
      + "&timezone=auto"
      + "&forecast_days=7";

    const response = await fetch(url);

    const data = await response.json();

    const current = data.current;

    const info =
      weatherCodes[current.weather_code]
      || ["Unknown", "🌡️"];


    document.getElementById("place").textContent =
      city + (country ? ", " + country : "");

    document.getElementById("timezone").textContent =
      data.timezone
      + " • "
      + data.timezone_abbreviation;


    document.getElementById("weatherIcon").textContent =
      info[1];

    document.getElementById("temperature").textContent =
      Math.round(current.temperature_2m)
      + "°C";

    document.getElementById("condition").textContent =
      info[0];


    document.getElementById("humidity").textContent =
      current.relative_humidity_2m + "%";

    document.getElementById("wind").textContent =
      Math.round(current.wind_speed_10m)
      + " km/h";

    document.getElementById("feels").textContent =
      Math.round(current.apparent_temperature)
      + "°C";

    document.getElementById("rain").textContent =
      (data.daily.precipitation_probability_max[0] || 0)
      + "%";

    document.getElementById("sunrise").textContent =
      getTime(data.daily.sunrise[0]);

    document.getElementById("sunset").textContent =
      getTime(data.daily.sunset[0]);


    const forecast =
      document.getElementById("forecast");

    forecast.innerHTML = "";


    data.daily.time.forEach(
      (date, index) => {

        const code =
          data.daily.weather_code[index];

        const weather =
          weatherCodes[code]
          || ["Unknown", "🌡️"];


        const card =
          document.createElement("div");

        card.className = "day";

        card.innerHTML = `

          <b>
            ${index === 0 ? "Today" : getDay(date)}
          </b>

          <div class="day-icon">
            ${weather[1]}
          </div>

          <b>
            ${Math.round(
              data.daily.temperature_2m_max[index]
            )}°
            /
            ${Math.round(
              data.daily.temperature_2m_min[index]
            )}°
          </b>

          <div class="rain">
            🌧️
            ${data.daily.precipitation_probability_max[index] || 0}%
          </div>

        `;

        forecast.appendChild(card);

      }
    );


    document.getElementById(
      "weatherApp"
    ).style.display = "block";


    setStatus("✅ Weather updated.");

  }

  catch {

    setStatus(
      "❌ Could not load weather data."
    );

  }

}


function useLocation() {

  if (!navigator.geolocation) {

    setStatus(
      "Geolocation is not supported."
    );

    return;

  }


  setStatus(
    "📍 Requesting your location..."
  );


  navigator.geolocation.getCurrentPosition(

    position => {

      loadWeather(
        position.coords.latitude,
        position.coords.longitude,
        "Your Location",
        ""
      );

    },

    () => {

      setStatus(
        "❌ Location permission was unavailable."
      );

    }

  );

}


document
  .getElementById("cityInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        searchCity();

      }

    }
  );


/* Default city */

loadWeather(
  23.8103,
  90.4125,
  "Dhaka",
  "Bangladesh"
);

</script>

</body>
</html>
